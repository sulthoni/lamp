<div class="container-fluid p-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">
        <i class="fas fa-icons"></i>
        SPARQL Query Interface
      </h2>
    </div>

    <div class="card-body">
      <form [formGroup]="queryForm" (ngSubmit)="executeQuery()">
        <!-- Repository Input -->
        <div class="mb-4">
          <label for="repositoryId" class="form-label">
            <i class="fas fa-list-alt"></i>
            Repository ID
          </label>
          <div class="input-group">
            <input
              id="repositoryId"
              type="text"
              formControlName="repositoryId"
              class="form-control"
              placeholder="Enter repository ID"
              [class.is-invalid]="
                queryForm.get('repositoryId')?.invalid &&
                queryForm.get('repositoryId')?.touched
              "
            />
          </div>
          <div
            class="invalid-feedback"
            *ngIf="
              queryForm.get('repositoryId')?.invalid &&
              queryForm.get('repositoryId')?.touched
            "
          >
            Repository ID is required
          </div>
        </div>

        <!-- SPARQL Query Input -->
        <div class="mb-4">
          <label for="queryInput" class="form-label">
            <i class="fa-solid fa-database"></i>
            SPARQL Query
          </label>
          <textarea
            id="queryInput"
            formControlName="query"
            rows="6"
            class="form-control font-monospace"
            placeholder="Enter your SPARQL query"
            [class.is-invalid]="
              queryForm.get('query')?.invalid && queryForm.get('query')?.touched
            "
          ></textarea>
          <div
            class="invalid-feedback"
            *ngIf="
              queryForm.get('query')?.invalid && queryForm.get('query')?.touched
            "
          >
            SPARQL query is required
          </div>
        </div>

        <!-- Execute Button -->
        <div class="d-grid gap-2">
          <button
            type="submit"
            [disabled]="queryForm.invalid || isLoading"
            class="btn btn-primary"
          >
            {{ isLoading ? "Executing Query..." : "Execute Query" }}
          </button>
        </div>
      </form>

      <!-- Error Message -->
      <div *ngIf="error" class="alert alert-danger mt-4">
        <i class="fa-solid fa-triangle-exclamation"></i>
        {{ error }}
      </div>

      <!-- Results Table -->
      <div *ngIf="results" class="mt-4">
        <div class="card">
          <div class="card-header bg-light">
            <i class="fa-solid fa-table"></i>
            Query Results
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-striped table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th *ngFor="let variable of results.head.vars" scope="col">
                      {{ variable }}
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let binding of results.results.bindings">
                    <td *ngFor="let variable of results.head.vars">
                      {{ binding[variable]?.value }}
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
