<div class="class-tree-container">
  <div
    *ngIf="loading"
    class="spinner-border text-primary loading-spinner"
    role="status"
  >
    <span class="visually-hidden">Loading...</span>
  </div>
  <ul *ngIf="!loading" class="list-unstyled">
    <li *ngFor="let classUri of classHierarchy">
      <span (click)="selectClass(classUri)" [class.active-class]="false">
        <i class="bi bi-caret-right-fill" *ngIf="hasSubclasses(classUri)"></i>
        {{ classes.get(classUri)?.label }}
      </span>
      <ul *ngIf="hasSubclasses(classUri)">
        <app-class-tree-node [classUri]="classUri"></app-class-tree-node>
      </ul>
    </li>
  </ul>

  <div *ngIf="!loading && classHierarchy.length == 0" class="no-data">
    <p>No Classes or data found</p>
  </div>
</div>
