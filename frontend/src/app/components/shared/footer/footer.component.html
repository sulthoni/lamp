<footer class="nga-footer">
  <div class="nga-hint">
    <div class="container">
      <div class="row p-4"></div>
    </div>
  </div>
  <div class="container py-5 text-center text-lg-start">
    <div class="row">
      <div class="col-12 col-lg-5 mb-3">
        <h2 class="h5">
          <img
            class="mb-1 me-1"
            [src]="'./assets/' + appInfo.logo + '-logo.png'"
            [srcset]="
              './assets/' +
              appInfo.logo +
              '-logo.png, ./assets/' +
              appInfo.logo +
              '-logo.png'
            "
            width="25"
            height="25"
            [alt]="'Logo ' + appInfo.name"
          />
          {{ appInfo.name }}
        </h2>
      </div>
      <div class="col-12 col-lg-5 mb-3">
        <p>Metadata Statistics Integrator tools</p>
        <p>Toward of Statistical Data Transparency</p>
      </div>
    </div>
  </div>
  <div class="py-3 text-center" style="background-color: black">
    <div class="container">
      <a [href]="'https://' + appInfo.website">{{ appInfo.website }}</a>
    </div>
  </div>
</footer>
