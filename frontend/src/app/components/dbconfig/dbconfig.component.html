<div class="container mt-4">
  <div class="row">
    <!-- Connection Form -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">
            <i class="fas fa-database me-2"></i>
            {{ isEditing ? "Edit Connection" : "New Connection" }}
          </h4>
        </div>
        <div class="card-body">
          <form [formGroup]="connectionForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Connection Name</label>
              <input type="text" class="form-control" formControlName="name" />
            </div>

            <div class="mb-3">
              <label class="form-label">Database Type</label>
              <select class="form-select" formControlName="type">
                <option value="mysql">MySQL</option>
                <option value="mssql">MS SQL Server</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Host</label>
              <input type="text" class="form-control" formControlName="host" />
            </div>

            <div class="mb-3">
              <label class="form-label">Port</label>
              <input
                type="number"
                class="form-control"
                formControlName="port"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Database Name</label>
              <input
                type="text"
                class="form-control"
                formControlName="database"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Username</label>
              <input
                type="text"
                class="form-control"
                formControlName="username"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                formControlName="password"
              />
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i>Save
              </button>
              <button
                type="button"
                class="btn btn-success"
                (click)="testConnection()"
              >
                <i class="fas fa-plug me-2"></i>Test Connection
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                (click)="resetForm()"
                *ngIf="isEditing"
              >
                <i class="fas fa-times me-2"></i>Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Saved Connections -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-info text-white">
          <h4 class="mb-0">
            <i class="fas fa-list me-2"></i>
            Saved Connections
          </h4>
        </div>
        <div class="card-body">
          <div class="list-group">
            <div
              *ngFor="let conn of connections"
              class="list-group-item list-group-item-action"
            >
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <h5 class="mb-1">{{ conn.name }}</h5>
                  <small>
                    <i
                      class="fas"
                      [ngClass]="
                        conn.type === 'mysql' ? 'fa-dolphin' : 'fa-window'
                      "
                    ></i>
                    {{ conn.type }} - {{ conn.host }}:{{ conn.port }}
                  </small>
                </div>
                <button
                  class="btn btn-sm btn-primary"
                  (click)="editConnection(conn)"
                >
                  <i class="fas fa-edit"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
