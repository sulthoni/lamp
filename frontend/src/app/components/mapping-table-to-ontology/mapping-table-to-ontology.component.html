<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <i class="fas fa-list me-2"></i>Connected Items
        </div>
        <div
          class="card-body list-group"
          cdkDropList
          id="connected-list"
          [cdkDropListData]="connectedItems"
          (cdkDropListDropped)="drop($event)"
        >
          <div
            *ngFor="let item of connectedItems; let i = index"
            class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            cdkDrag
            [id]="'connected-' + item.id"
          >
            {{ item.name }}
            <button class="btn btn-sm btn-danger" (click)="removeConnection(i)">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-secondary text-white">
          <i class="fas fa-list-alt me-2"></i>Available Items
        </div>
        <div
          class="card-body list-group"
          cdkDropList
          id="available-list"
          [cdkDropListData]="availableItems"
          (cdkDropListDropped)="drop($event)"
        >
          <div
            *ngFor="let item of availableItems; let i = index"
            class="list-group-item list-group-item-action"
            cdkDrag
            [id]="'available-' + item.id"
          >
            {{ item.name }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
